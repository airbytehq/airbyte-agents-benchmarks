name: linear-list
title: "Linear — List first 50 issues"
connector: linear
connector_id_env: LINEAR_CONNECTOR_ID
description: |
  List the first 50 Linear issues.
  Agent requests id, identifier, title, state, priority, createdAt, updatedAt, team, and labels per record.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: LINEAR_CONNECTOR_ID
        args:
          entity: issues
          action: list
          params:
            first: 50
          select_fields: [id, identifier, title, state, priority, createdAt, updatedAt, team, labels]

  native-mcp:
    tool_calls:
      - server: linear
        tool: list_issues
        args:
          limit: 50
