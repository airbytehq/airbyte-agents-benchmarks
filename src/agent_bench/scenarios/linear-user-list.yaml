name: linear-user-list
title: "Linear — List all users"
connector: linear
connector_id_env: LINEAR_CONNECTOR_ID
description: |
  List all Linear workspace members.
  Agent requests id, name, active, admin, and isMe per record.
  Both paths use `paginate_to_end` to exhaust all pages automatically.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: LINEAR_CONNECTOR_ID
        paginate_to_end: true
        args:
          entity: users
          action: list
          params:
            limit: 1000
          select_fields: [id, name, active, admin, isMe]

  native-mcp:
    tool_calls:
      - server: linear
        tool: list_users
        args: {}
