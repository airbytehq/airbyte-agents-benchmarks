name: zendesk-search
title: "Zendesk — Search tickets by keyword"
connector: zendesk
connector_id_env: ZENDESK_CONNECTOR_ID
description: >
  Search Zendesk tickets matching a keyword. An agent triaging support
  needs subject and priority, not the full ticket payload.

task:
  label: "Search tickets by keyword"
  action: search
  entity: tickets
  metric_focus: narrow_context
  params:
    keyword: "sync"
