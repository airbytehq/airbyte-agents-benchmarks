name: slack
title: "Slack — 3-task head-to-head"
connector: slack
connector_id_env: SLACK_CONNECTOR_ID
description: >
  Slack head-to-head across three agent data tasks. Shows narrow-context search,
  single-record fetch latency, and a bulk-list comparison where Claude MCP has
  no native equivalent.

tasks:
  - label: "Search channels by keyword"
    action: search
    entity: channels
    metric_focus: narrow_context
    params:
      keyword: "agent"
  - label: "Get single channel by ID"
    action: get
    entity: channels
    metric_focus: single_record_fetch
    params:
      id: "C02TD5CB7PZ"
      name_hint: "feedback_survey_results"
  - label: "List first 50 channels"
    action: list
    entity: channels
    metric_focus: bulk_list
    params:
      limit: 50
