name: gong-search
title: "Gong — List calls by date range"
connector: gong
connector_id_env: GONG_CONNECTOR_ID
description: |
  List Gong calls within a date range.
  Agent requests id, title, scheduled, and duration per result.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: GONG_CONNECTOR_ID
        args:
          entity: calls
          action: context_store_search
          params:
            query:
              filter:
                gte:
                  scheduled: "2026-04-01"
                lte:
                  scheduled: "2026-04-30"
            limit: 100
          select_fields: [id, title, scheduled, duration]

  native-mcp:
    tool_calls:
      - server: gong
        tool: list_calls
        args:
          fromDateTime: "2026-04-01T00:00:00Z"
          toDateTime: "2026-04-30T23:59:59Z"
