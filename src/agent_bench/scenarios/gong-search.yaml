name: gong-search
title: "Gong — Search calls by keyword"
connector: gong
connector_id_env: GONG_CONNECTOR_ID
description: >
  Search Gong calls matching a keyword. An agent answering
  "what calls do I have about Airbyte?" needs only the call title
  and schedule — not the full call object.

task:
  label: "Search calls by keyword"
  action: search
  entity: calls
  metric_focus: narrow_context
  params:
    keyword: "airbyte"
