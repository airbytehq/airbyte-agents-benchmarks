name: gong-search
title: "Gong — Search calls by keyword"
connector: gong
connector_id_env: GONG_CONNECTOR_ID
description: |
  Search Gong calls matching a keyword.
  Agent requests id, title, scheduled, and duration per result.

annotations:
  record_count: >
    ℹ️Unequal record counts amplify the ratio. Per-record savings are proportional to get/list.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: GONG_CONNECTOR_ID
        args:
          entity: calls
          action: context_store_search
          params:
            query:
              filter:
                fuzzy:
                  title: "airbyte"
            limit: 10
          select_fields: [id, title, scheduled, duration]

  native-mcp:
    tool_calls:
      - server: gong
        tool: search_calls
        args:
          keyword: "airbyte"
