name: gong-search
title: "Gong — Search calls by keyword"
connector: gong
connector_id_env: GONG_CONNECTOR_ID
is_comparable: false
description: |
  Search Gong calls matching a keyword.
  Agent requests id, title, scheduled, and duration per result.

annotations:
  not_comparable: >
    ℹ️ The Gong REST API (and the third-party kenazk/gong-mcp server) does not expose
    a keyword/text search endpoint. Native MCP can only list calls by date range with
    a fixed page size of 100. Agent-mcp uses context_store_search with fuzzy matching,
    a capability that has no native equivalent.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: GONG_CONNECTOR_ID
        args:
          entity: calls
          action: context_store_search
          params:
            query:
              filter:
                fuzzy:
                  title: "airbyte"
            limit: 10
          select_fields: [id, title, scheduled, duration]

  native-mcp:
    tool_calls:
      - server: gong
        tool: list_calls
        args:
          fromDateTime: "2025-01-01T00:00:00Z"
