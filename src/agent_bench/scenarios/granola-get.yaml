name: granola-get
title: "Granola — Get single note by ID (with transcript)"
connector: granola
connector_id_env: GRANOLA_CONNECTOR_ID
description: >
  Fetch a single Granola note by ID including transcript. Native MCP
  requires a separate tool call (get_meeting_transcript) with a UUID.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: GRANOLA_CONNECTOR_ID
        args:
          entity: notes
          action: get
          params:
            note_id: "not_ES3idLqBAmN9L1"
          select_fields: [id, title, created_at, updated_at, attendees, summary_text, transcript]

  native-mcp:
    tool_calls:
      - server: granola
        tool: get_meeting_transcript
        args:
          meeting_id: "96457d50-5ed1-4d81-a2fc-f43c2b93530d"
