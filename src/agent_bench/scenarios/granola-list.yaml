name: granola-list
title: "Granola — List first 25 notes"
connector: granola
connector_id_env: GRANOLA_CONNECTOR_ID
description: >
  List the first 25 Granola notes. Granola API caps page_size at 25;
  values above 25 return HTTP 400.

task:
  label: "List first 25 notes"
  action: list
  entity: notes
  metric_focus: bulk_list
  params:
    limit: 25
