name: granola-list
title: "Granola — List first 25 notes"
connector: granola
connector_id_env: GRANOLA_CONNECTOR_ID
description: >
  List the first 25 Granola notes. Granola API caps page_size at 25;
  values above 25 return HTTP 400.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: GRANOLA_CONNECTOR_ID
        args:
          entity: notes
          action: list
          params:
            page_size: 25
          select_fields: [id, title, created_at, updated_at, attendees, summary_text, transcript]

  native-mcp:
    tool_calls:
      - server: granola
        tool: list_meetings
        args:
          page_size: 25
