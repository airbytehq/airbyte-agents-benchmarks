name: linear-get
title: "Linear — Get single issue by ID"
connector: linear
connector_id_env: LINEAR_CONNECTOR_ID
description: |
  Look up a single Linear issue by ID, retrieving specific fields such as title,
  state, priority, etc.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: LINEAR_CONNECTOR_ID
        args:
          entity: issues
          action: context_store_search
          params:
            query:
              filter:
                eq:
                  identifier: "AGENTIC-1294"
            limit: 1
          select_fields: [id, identifier, title, state, priority, createdAt, updatedAt, team, labels]

  native-mcp:
    tool_calls:
      - server: linear
        tool: get_issue
        args:
          id: "AGENTIC-1294"
