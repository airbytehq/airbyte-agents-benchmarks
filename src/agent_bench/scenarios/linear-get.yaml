name: linear-get
title: "Linear — Get single issue by ID"
connector: linear
connector_id_env: LINEAR_CONNECTOR_ID
description: |
  Look up a single Linear issue by ID.
  Agent requests id, identifier, title, state, priority, createdAt, updatedAt, team, and labels.

annotations:
  workspace_mismatch: >
    ℹ️ The agent-mcp connector and native Linear MCP are currently connected to different
    Linear workspaces. Agent-mcp syncs from the AGENTIC workspace (issues prefixed `AGENTIC-`),
    while the native MCP API key connects to `airbyte-integration-testing` (issues prefixed `AIR-`).
    Each path fetches a valid single issue from its own workspace; the benchmark measures
    token overhead, not data identity.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: LINEAR_CONNECTOR_ID
        args:
          entity: issues
          action: context_store_search
          params:
            query:
              filter:
                eq:
                  identifier: "AGENTIC-1294"
            limit: 1
          select_fields: [id, identifier, title, state, priority, createdAt, updatedAt, team, labels]

  native-mcp:
    tool_calls:
      - server: linear
        tool: get_issue
        args:
          id: "AIR-55"
