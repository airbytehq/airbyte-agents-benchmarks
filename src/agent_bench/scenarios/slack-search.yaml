name: slack-search
title: "Slack — Search channels by keyword"
connector: slack
connector_id_env: SLACK_CONNECTOR_ID
is_comparable: false
skip_recording: true  # Context store not populated; context_store_search returns 0 records.
description: |
  Search Slack channels by keyword.
  Agent requests id, name, num_members, is_archived, is_private, created, updated, topic, and purpose per result.

annotations:
  context_store_empty: >
    The Slack connector's context store is not populated in the benchmark
    workspace. `context_store_search` returns `data: []` for any query.
    This scenario is excluded from recording until the context store is
    seeded. See also `slack-get` which has the same limitation and uses
    `action: get` as a workaround.
  tool_mismatch: >
    Slack's hosted MCP server (`https://mcp.slack.com/mcp`) exposes
    [`slack_search_channels`](https://docs.slack.dev/ai/slack-mcp-server/),
    which is a clean fit for keyword channel search. Results are
    cursor-paginated and capped at 20 per call.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: SLACK_CONNECTOR_ID
        args:
          entity: channels
          action: context_store_search
          params:
            query:
              filter:
                fuzzy:
                  name: "agent"
            limit: 10
          select_fields: [id, name, num_members, is_archived, is_private, created, updated, topic, purpose]

  native-mcp:
    tool_calls:
      - server: slack
        tool: slack_search_channels
        args:
          query: "agent"
          limit: 20
