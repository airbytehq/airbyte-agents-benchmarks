name: slack-search
title: "Slack — Search channels by keyword"
connector: slack
connector_id_env: SLACK_CONNECTOR_ID
is_comparable: false
description: |
  Search Slack channels by keyword.
  Agent requests id, name, num_members, is_archived, is_private, created, updated, topic, and purpose per result.

annotations:
  tool_mismatch: >
    🛑No native search/filter tool exists in
    [@modelcontextprotocol/server-slack](https://github.com/modelcontextprotocol/servers-archived/tree/main/src/slack)
    ([v2025.4.25](https://www.npmjs.com/package/@modelcontextprotocol/server-slack)).
    All 8 tools:
    `slack_list_channels`, `slack_post_message`, `slack_reply_to_thread`, `slack_add_reaction`,
    `slack_get_channel_history`, `slack_get_thread_replies`, `slack_get_users`, `slack_get_user_profile`.
    None support keyword filtering on channel names.
    Alternative path: paginate `slack_list_channels` (all pages) and filter client-side by keyword
    (est. approximately 13,400 tokens to scan all approximately 60 channels at approximately 4,500 tokens/page of 20;
    must exhaust every page to find all matches).

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: SLACK_CONNECTOR_ID
        args:
          entity: channels
          action: context_store_search
          params:
            query:
              filter:
                fuzzy:
                  name: "agent"
            limit: 10
          select_fields: [id, name, num_members, is_archived, is_private, created, updated, topic, purpose]

  native-mcp:
    tool_calls:
      - server: slack
        tool: slack_list_channels
        args:
          limit: 20
