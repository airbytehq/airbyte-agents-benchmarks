name: granola
title: "Granola — 3-task head-to-head"
connector: granola
connector_id_env: GRANOLA_CONNECTOR_ID
description: >
  Granola head-to-head. Strong single-record-fetch angle (transcript by ID)
  where native MCP requires separate tool call; SDK/MCP return the full note.

tasks:
  - label: "Search notes by keyword"
    action: search
    entity: notes
    metric_focus: narrow_context
    params:
      keyword: "context store"
      limit: 1
  - label: "Get single note by ID (with transcript)"
    action: get
    entity: notes
    metric_focus: single_record_fetch
    params:
      id: "not_ES3idLqBAmN9L1"
      claude_mcp_id: "96457d50-5ed1-4d81-a2fc-f43c2b93530d"
  - label: "List first 25 notes"
    action: list
    entity: notes
    metric_focus: bulk_list
    params:
      limit: 25  # Granola API caps page_size at 25; >25 returns HTTP 400
