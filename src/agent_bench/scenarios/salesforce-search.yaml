name: salesforce-search
title: "Salesforce — Search accounts by keyword"
connector: salesforce
connector_id_env: SALESFORCE_CONNECTOR_ID
description: |
  Search Salesforce accounts matching a keyword, retrieving specific fields such as Name, Type, and Industry.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: SALESFORCE_CONNECTOR_ID
        args:
          entity: accounts
          action: context_store_search
          params:
            query:
              filter:
                fuzzy:
                  Name: "airbyte"
            limit: 10
          select_fields: [Id, Name, Type, Industry]

  native-mcp:
    tool_calls:
      - server: salesforce
        tool: find
        args:
          q: "FIND {airbyte} IN ALL FIELDS RETURNING Account(Id, Name, Type, Industry LIMIT 10)"
