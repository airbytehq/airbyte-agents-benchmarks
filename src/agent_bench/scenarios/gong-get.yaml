name: gong-get
title: "Gong — Get single call by ID"
connector: gong
connector_id_env: GONG_CONNECTOR_ID
is_comparable: false
description: |
  Look up a single Gong call by ID.
  Agent requests id, title, scheduled, and duration.

annotations:
  highlight: >
    💎 Only requested fields consume token context: `id`, `title`, `scheduled`, and `duration`.
  tool_mismatch: >
    🛑 No native `get-by-ID` functionality in
    [kenazk/gong-mcp](https://github.com/kenazk/gong-mcp).

    Gong MCP has `list_calls` (date-range listing)
    and `retrieve_transcripts` (transcript text by call ID).
    Gong REST API has `GET /v2/calls/{id}` but the MCP server does not wrap it.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: GONG_CONNECTOR_ID
        args:
          entity: calls
          action: context_store_search
          params:
            query:
              filter:
                eq:
                  id: "1005803797056190704"
            limit: 1
          select_fields: [id, title, scheduled, duration]

  # native-mcp intentionally omitted — no get-by-ID tool exists in kenazk/gong-mcp
