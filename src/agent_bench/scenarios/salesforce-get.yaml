name: salesforce-get
title: "Salesforce — Get single account by ID"
connector: salesforce
connector_id_env: SALESFORCE_CONNECTOR_ID
description: |
  Fetch a single Salesforce account by ID.
  Agent requests Id, Name, Type, and Industry.
  Both paths query the same Salesforce org (airbyte.my.salesforce.com).

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: SALESFORCE_CONNECTOR_ID
        args:
          entity: accounts
          action: get
          params:
            id: "0015e00000FMsFhAAL"
          select_fields: [Id, Name, Type, Industry]

  native-mcp:
    tool_calls:
      - server: salesforce
        tool: soql_query
        args:
          q: "SELECT Id, Name, Type, Industry FROM Account WHERE Id = '0015e00000FMsFhAAL'"
