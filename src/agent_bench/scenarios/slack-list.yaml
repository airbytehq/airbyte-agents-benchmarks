name: slack-list
title: "Slack — List first 50 channels"
connector: slack
connector_id_env: SLACK_CONNECTOR_ID
description: |
  List the first 50 Slack channels.
  Agent requests id, name, num_members, is_archived, is_private, created, updated, topic, and purpose per record.

task:
  label: "List first 50 channels"
  action: list
  entity: channels
  metric_focus: bulk_list
  params:
    limit: 50
