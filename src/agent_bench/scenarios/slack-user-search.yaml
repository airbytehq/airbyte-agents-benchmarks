name: slack-user-search
title: "Slack — Search users by display name"
connector: slack
connector_id_env: SLACK_CONNECTOR_ID
is_comparable: false
hidden: true
hidden_reason: |
  No Context Store Data.
  Timeline: https://cloud.airbyte.com/workspaces/df5fa524-ed3a-4f59-90ef-0906f3b945c0/connections/b8626fbd-20d7-4c50-ac28-1153295ea2b2/timeline
  Workspace: https://app.airbyte.ai/organizations/145bfc59-1eed-4266-96bf-d527fb3e5765/connectors
description: |
  Search Slack workspace members by display name.
  Agent requests id, real_name, team_id, is_admin, is_bot, and deleted.

annotations:
  tool_mismatch: >
    Slack's hosted MCP server (`https://mcp.slack.com/mcp`) exposes
    [`slack_search_users`](https://docs.slack.dev/ai/slack-mcp-server/),
    which searches across name, email, and other profile attributes.
    Results are cursor-paginated and capped at 20 per call.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: SLACK_CONNECTOR_ID
        args:
          entity: users
          action: context_store_search
          params:
            query:
              filter:
                fuzzy:
                  real_name: "airbyte"
            limit: 10
          select_fields: [id, real_name, team_id, is_admin, is_bot, deleted]

  native-mcp:
    tool_calls:
      - server: slack
        tool: slack_search_users
        args:
          query: "airbyte"
          limit: 20

