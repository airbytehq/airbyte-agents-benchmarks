name: gong-list
title: "Gong — List recent calls"
connector: gong
connector_id_env: GONG_CONNECTOR_ID
description: |
  List the most recent Gong calls.
  Agent requests id, title, scheduled, and duration per record.

annotations:
  highlight: >
    💎Only requested fields consume token context: `id`, `title`, `scheduled`, and `duration`.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: GONG_CONNECTOR_ID
        args:
          entity: calls
          action: list
          params:
            limit: 50
          select_fields: [id, title, scheduled, duration]

  native-mcp:
    tool_calls:
      - server: gong
        tool: list_calls
        args:
          fromDateTime: "2025-01-01T00:00:00Z"
