name: gong-to-salesforce-zendesk-lookup
title: "Cross-system: Gong calls on 2026-04-28 → Salesforce + Zendesk lookup"
connector: multi_source
connector_id_env: GONG_CONNECTOR_ID
hidden: true
hidden_reason: >
  Record counts diverge between paths (agent-mcp: 22, native-mcp: 145).
  Working on revising scenario to return finite sets comparably.
description: |
  Find all Gong calls scheduled for 2026-04-28, then look up the account names
  in Salesforce and find open tickets for those accounts in Zendesk.

methodology: |
  Search Gong for calls scheduled on 2026-04-28, then look up associated
  account names in Salesforce and find open tickets for those accounts in
  Zendesk.

  Step inputs (account names, ticket filters) for steps 2 and 3 are statically
  seeded from values captured at recording time. The harness replays
  each step deterministically; it does not dynamically chain outputs
  between steps at runtime. See `docs/METHODOLOGY.md` for details.

faux_prompt: >

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: GONG_CONNECTOR_ID
        args:
          entity: calls
          action: context_store_search
          params:
            query:
              filter:
                gte:
                  scheduled: "2026-04-28"
                lte:
                  scheduled: "2026-04-28"
            limit: 20
          select_fields: [id, title, scheduled, duration]

      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: SALESFORCE_CONNECTOR_ID
        args:
          entity: accounts
          action: context_store_search
          params:
            query:
              filter:
                in:
                  Name: ["Acme Corp", "Preset", "RVezy"]
            limit: 20
          select_fields: [Id, Name, Type, Industry]

      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: ZENDESK_CONNECTOR_ID
        args:
          entity: tickets
          action: context_store_search
          params:
            query:
              filter:
                in:
                  subject: ["Acme Corp", "Preset", "RVezy"]
            limit: 20
          select_fields: [id, subject, status, priority]

  native-mcp:
    tool_calls:
      - server: gong
        tool: list_calls
        args:
          fromDateTime: "2026-04-28T00:00:00Z"
          toDateTime: "2026-04-28T23:59:59Z"

      - server: salesforce
        tool: soqlQuery
        args:
          q: "SELECT Id, Name, Type, Industry FROM Account WHERE Name IN ('Acme Corp', 'Preset', 'RVezy')"

      - server: zendesk
        tool: zendeskSearchTickets
        args:
          query: "subject:Acme Corp OR subject:Preset OR subject:RVezy status:open"
