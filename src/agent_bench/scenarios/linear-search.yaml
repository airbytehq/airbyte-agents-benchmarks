name: linear-search
title: "Linear — Search issues by keyword"
connector: linear
connector_id_env: LINEAR_CONNECTOR_ID
description: |
  Search Linear issues by keyword.
  Agent requests id, identifier, title, state, priority, createdAt, updatedAt, team, and labels per result.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: LINEAR_CONNECTOR_ID
        args:
          entity: issues
          action: context_store_search
          params:
            query:
              filter:
                fuzzy:
                  title: "backend"
            limit: 8  # capped to match native-mcp result count for fair comparison
          select_fields: [id, identifier, title, state, priority, createdAt, updatedAt, team, labels]

  native-mcp:
    tool_calls:
      - server: linear
        tool: list_issues
        args:
          query: "backend"
          limit: 8  # capped to match agent-mcp context store result count
