name: zendesk-list
title: "Zendesk — List recent tickets"
connector: zendesk
connector_id_env: ZENDESK_CONNECTOR_ID
description: |
  List recent Zendesk tickets.
  Agent requests id, subject, status, and priority per record.

annotations:
  highlight: >
    💎Agent returned more records with fewer tokens.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: ZENDESK_CONNECTOR_ID
        args:
          entity: tickets
          action: list
          params:
            limit: 50
          select_fields: [id, subject, status, priority]

  native-mcp:
    tool_calls:
      - server: zendesk
        tool: zendeskListTickets
        args: {}
