name: linear-user-search
title: "Linear — Search users by name"
connector: linear
connector_id_env: LINEAR_CONNECTOR_ID
is_comparable: false
description: |
  Search Linear workspace members by name.
  Agent requests id, name, active, admin, and isMe.

annotations:
  tool_mismatch: >
    🛑No native user search tool exists in Linear's official MCP server
    ([mcp.linear.app](https://linear.app/docs/mcp), 24 tools).
    `list_users` returns all members with no name filter parameter.
    `get_user` requires a user ID.
    The Linear GraphQL API supports `users(filter: { name: { contains: "..." } })`
    ([filtering docs](https://linear.app/developers/filtering)),
    but the MCP does not expose this capability.
    Alternative path: call `list_users` to retrieve all workspace members and filter client-side.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: LINEAR_CONNECTOR_ID
        args:
          entity: users
          action: context_store_search
          params:
            query:
              filter:
                fuzzy:
                  name: "airbyte"
            limit: 10
          select_fields: [id, name, active, admin, isMe]

