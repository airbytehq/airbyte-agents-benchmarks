name: linear-project-list
title: "Linear — List all projects"
connector: linear
connector_id_env: LINEAR_CONNECTOR_ID
description: |
  List all Linear projects in the workspace.
  Agent requests id, name, state, and progress per record.
  Both paths use `paginate_to_end` to exhaust all pages automatically.

paths:
  agent-mcp:
    tool_calls:
      - server: airbyte-agent
        tool: integrations_connectors_id_execute
        connector_id_env: LINEAR_CONNECTOR_ID
        paginate_to_end: true
        args:
          entity: projects
          action: list
          params:
            limit: 1000
          select_fields: [id, name, state, progress]

  native-mcp:
    tool_calls:
      - server: linear
        tool: list_projects
        args: {}
