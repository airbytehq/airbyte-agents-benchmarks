[project]
name = "agent-bench"
version = "0.2.0"
description = "Two-way benchmark: Agent MCP vs Native MCP for AI agent data access"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "typer>=0.9",
    "pyyaml>=6.0",
    "tiktoken>=0.5",
    "httpx>=0.24",
    "mcp>=1.10",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
agent-bench = "agent_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
